name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Biblioteki systemowe (Qt, OpenGL, PortAudio)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libportaudio2 libsndfile1 xvfb
      - name: Zależności
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .
      - name: Pytest (z OpenGL przez Xvfb)
        run: xvfb-run -a -s "-screen 0 1280x720x24" pytest
