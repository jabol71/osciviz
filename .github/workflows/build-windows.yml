name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Zależności
        run: pip install -r requirements.txt pyinstaller
      - name: PyInstaller
        run: pyinstaller packaging/osciviz.spec --noconfirm
      - name: Test uruchomienia paczki
        shell: pwsh
        run: |
          # Sprawdza, czy spakowany program w ogóle startuje (import wszystkich modułów).
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process dist\OsciViz\OsciViz.exe -ArgumentList "--self-test" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Self-test zwrócił kod $($p.ExitCode)" }
      - name: Spakuj (wersja przenośna)
        shell: pwsh
        run: Compress-Archive -Path dist\OsciViz -DestinationPath dist\OsciViz-Windows-x64.zip
      - name: Instalator (Inno Setup)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          if ("${{ github.ref_type }}" -ne "tag") { $version = "1.0.0" }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging\osciviz.iss
      - uses: actions/upload-artifact@v4
        with:
          name: OsciViz-Windows-x64
          path: |
            dist/OsciViz-Windows-x64.zip
            dist/OsciViz-Windows-x64-setup.exe
      - name: Dołącz do wydania
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OsciViz-Windows-x64.zip
            dist/OsciViz-Windows-x64-setup.exe
